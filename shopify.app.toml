# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "447ba463b8a37bbb478907ed327ccb7c"
name = "CareNet WhatsApp"
application_url = "https://apps.carenetsolutions.co.uk"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "https://apps.carenetsolutions.co.uk/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "https://apps.carenetsolutions.co.uk/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "https://apps.carenetsolutions.co.uk/webhooks/compliance.php"

[access_scopes]
# App only reads/writes its own installation metafields via GraphQL Admin API.
scopes = ""

[auth]
redirect_urls = [
  "https://apps.carenetsolutions.co.uk/auth/callback",
  "https://apps.carenetsolutions.co.uk/auth/callback/"
]